<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="简约风格的个人名片">
  <title>林默的个人名片</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 页面主区域：将名片垂直、水平居中展示 -->
  <main class="page-shell">
    <!-- 个人名片主体 -->
    <article class="business-card">
      <!-- 使用首字母作为头像内容，避免依赖外部图片资源 -->
      <div class="avatar" aria-label="林默的头像">LM</div>

      <!-- 个人基本信息 -->
      <div class="profile">
        <h1>林默</h1>
        <p class="job-title">产品设计师</p>
        <p class="intro">专注于把复杂的问题，设计成清晰而有温度的体验。</p>
      </div>

      <!-- 联系方式列表 -->
      <address class="contact-list">
        <a href="mailto:hello@linmo.design" class="contact-item">
          <span class="contact-icon" aria-hidden="true">@</span>
          <span>hello@linmo.design</span>
        </a>
        <a href="tel:+8613800138000" class="contact-item">
          <span class="contact-icon" aria-hidden="true">☎</span>
          <span>+86 138 0013 8000</span>
        </a>
        <span class="contact-item">
          <span class="contact-icon" aria-hidden="true">⌖</span>
          <span>上海 · 中国</span>
        </span>
      </address>
    </article>
  </main>
</body>
</html>
